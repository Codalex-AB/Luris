<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16251f">
  <title>Luris — Bluff. Build. Reveal.</title>
  <style>
    :root {
      --ink: #f4f0e5;
      --muted: #adbaa9;
      --felt: #1d3b30;
      --felt-deep: #142a22;
      --gold: #e4b96c;
      --gold-bright: #f5d38d;
      --coral: #ee7c65;
      --cream: #f8f4e9;
      --shadow: 0 18px 50px rgba(0, 0, 0, .26);
      --card-w: 46px;
      --card-h: 66px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      background: #101b18;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; }
    .shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: radial-gradient(circle at 50% -20%, #315e48, var(--felt) 38%, var(--felt-deep) 100%); }
    .topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 100%; max-width: 1380px; padding: 10px clamp(14px, 3vw, 40px); margin: auto; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid rgba(245, 211, 141, .5); border-radius: 11px; color: var(--gold-bright); font-family: Georgia, serif; font-size: 22px; transform: rotate(-8deg); }
    .brand-name { font: 700 22px Georgia, serif; letter-spacing: .08em; }
    .brand-tag { color: var(--muted); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .top-actions { display: flex; gap: 9px; }
    .icon-btn, .ghost-btn { border: 1px solid rgba(236, 235, 215, .18); border-radius: 99px; padding: 9px 14px; color: var(--ink); background: rgba(255,255,255,.07); cursor: pointer; transition: .18s ease; }
    .icon-btn:hover, .ghost-btn:hover { border-color: var(--gold); background: rgba(255,255,255,.13); }

    main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1380px; margin: auto; padding: 0 clamp(10px, 3vw, 40px) 10px; }
    .game-head { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 4px 0 8px; }
    h1, h2, p { margin: 0; }
    h1 { font: 500 clamp(21px, 3vw, 32px)/1 Georgia, serif; letter-spacing: -.03em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .turn-pill { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border: 1px solid rgba(245, 211, 141, .35); border-radius: 99px; color: var(--gold-bright); background: rgba(0,0,0,.16); font-size: 12px; white-space: nowrap; }
    .turn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold-bright); box-shadow: 0 0 15px var(--gold); }
    .table { position: relative; flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: minmax(76px, 1fr) 72px minmax(76px, 1fr) auto auto auto; gap: 5px; padding: clamp(10px, 2vw, 20px); border: 1px solid rgba(255,255,255,.13); border-radius: 24px; background: linear-gradient(145deg, rgba(8, 25, 19, .2), rgba(255,255,255,.035)); box-shadow: var(--shadow); overflow: hidden; }
    .player-zone { min-height: 0; overflow: hidden; contain: paint; }
    .player-zone.bot { padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .player-zone.human { padding-top: 5px; }
    .zone-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 5px; }
    .zone-meta { display: flex; align-items: center; gap: 10px; }
    .clock { min-width: 54px; padding: 4px 7px; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; color: var(--ink); background: rgba(0,0,0,.2); font: 700 16px/1 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: center; }
    .clock.active { border-color: var(--gold); color: var(--gold-bright); box-shadow: 0 0 10px rgba(228,185,108,.18); }
    .clock.low { color: var(--coral); }
    .bot-report { display: -webkit-box; height: 34px; min-height: 34px; margin: -2px 0 4px 38px; overflow: hidden; color: var(--gold-bright); font-size: 13px; line-height: 1.3; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .player-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 10px; color: #173128; background: var(--gold); font-size: 14px; }
    .human .avatar { background: var(--coral); color: #3b201c; }
    .score { color: var(--muted); font-size: 12px; }
    .sets { display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-start; gap: 5px; min-height: 48px; max-height: calc(100% - 31px); overflow: hidden; }
    .player-zone.bot .sets { max-height: calc(100% - 68px); }
    .empty { width: 100%; padding: 14px 8px; border: 1px dashed rgba(255,255,255,.13); border-radius: 12px; color: rgba(255,255,255,.42); text-align: center; font-size: 11px; }
    .set { display: flex; gap: 2px; align-items: center; min-height: 55px; padding: 4px; border: 1px solid rgba(228,185,108,.28); border-radius: 10px; background: rgba(5, 19, 14, .28); transition: .2s; }
    .set.selectable { cursor: pointer; }
    .set.inspectable { cursor: pointer; }
    .set:hover, .set:focus-within { border-color: var(--gold); transform: translateY(-2px); }
    .set.danger { animation: shake .35s ease; }
    .card { position: relative; display: grid; place-items: center; width: var(--card-w); height: var(--card-h); border: 1px solid #d8d0bb; border-radius: 8px; color: #282622; background: var(--cream); box-shadow: 0 4px 7px rgba(0,0,0,.2); font: 700 21px Georgia, serif; user-select: none; }
    .card.red { color: #b84943; }
    .card.face-down, .back { border-color: #d7ae64; color: var(--gold-bright); background: repeating-linear-gradient(135deg, #2e5b47 0 4px, #244c3b 4px 8px); }
    .card.face-down { cursor: pointer; }
    .card.face-down::after { content: "✦"; font-size: 20px; opacity: .78; }
    .card.selected, .hand-card.selected .card { outline: 3px solid var(--gold-bright); outline-offset: 1px; transform: translateY(-5px); }
    .card.table-selected { outline: 3px solid var(--coral); outline-offset: 2px; transform: translateY(-4px); box-shadow: 0 0 16px rgba(238,124,101,.55); }
    .card.flip-in { animation: flip-in .72s ease both; transform-style: preserve-3d; }
    .card.swap-in { animation: swap-in .72s ease both; }
    .card.swap-out { animation: swap-out .72s ease both; }
    .card.draw-in { animation: draw-in .6s ease both; }
    .card.discard-out { animation: discard-out .52s ease forwards; }
    .card.discard-in { animation: discard-in .55s ease both; }
    .set.placing { animation: place-set .72s cubic-bezier(.2,.8,.2,1) both; }
    .flying-card { position: fixed; z-index: 20; pointer-events: none; transform-origin: top left; transition: transform .68s cubic-bezier(.2,.75,.2,1), opacity .68s ease; filter: drop-shadow(0 12px 14px rgba(0,0,0,.35)); }
    .flying-card .card { width: 100%; height: 100%; }
    .card .corner { position: absolute; top: 4px; left: 5px; font-size: 13px; line-height: 1; }
    .card .rank { font-size: 27px; line-height: 1; letter-spacing: -.04em; }
    .card .suit { position: absolute; right: 5px; bottom: 3px; font-size: 14px; line-height: 1; opacity: .9; }
    .card.joker { color: #a85b39; font-size: 12px; letter-spacing: .03em; }
    .card.joker .suit { font-size: 19px; color: var(--gold); }
    .hand-wrap { padding: 8px 10px 5px; border: 1px solid rgba(255,255,255,.13); border-radius: 14px; background: rgba(5, 16, 12, .2); overflow: hidden; }
    .hand { display: grid; grid-template-columns: repeat(auto-fit, var(--card-w)); justify-content: center; gap: 4px; min-height: calc(var(--card-h) + var(--card-h) + 4px); max-height: 140px; }
    .hand .card { cursor: pointer; }
    .hand-note { margin-top: 3px; color: var(--muted); text-align: center; font-size: 10px; }
    .middle { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: clamp(8px, 3vw, 28px); min-height: 0; padding: 3px 0; }
    .pile { display: flex; align-items: center; gap: 12px; }
    .middle > .pile:first-child { justify-self: end; }
    .pile.right { position: relative; justify-self: center; justify-content: flex-start; width: var(--card-w); }
    .pile.right > div:last-child { position: absolute; left: calc(var(--card-w) + 10px); }
    .pile-label { color: var(--muted); font-size: 11px; line-height: 1.35; text-transform: uppercase; letter-spacing: .1em; }
    .pile-count { color: var(--ink); font-size: 21px; font-weight: 700; }
    .back { display: grid; place-items: center; width: var(--card-w); height: var(--card-h); border: 1px solid #d7ae64; border-radius: 8px; box-shadow: 0 5px 8px rgba(0,0,0,.2); font-size: 20px; }
    .discard .card { cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-height: 36px; margin-top: 3px; }
    .action { min-height: 36px; padding: 7px 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; color: var(--ink); background: rgba(255,255,255,.08); cursor: pointer; transition: .18s ease; }
    .action:hover:not(:disabled) { border-color: var(--gold); background: rgba(228,185,108,.15); transform: translateY(-1px); }
    .action.primary { border-color: var(--gold); color: #2a2114; background: var(--gold); font-weight: 700; }
    .action.primary:hover:not(:disabled) { background: var(--gold-bright); }
    .action.end-turn { box-shadow: 0 0 0 3px rgba(245,211,141,.16), 0 0 18px rgba(228,185,108,.24); }
    .action:disabled { opacity: .38; cursor: not-allowed; }
    .status { min-height: 18px; color: var(--gold-bright); text-align: center; font-size: 12px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 18px; background: rgba(4, 12, 9, .75); backdrop-filter: blur(8px); }
    .modal { width: min(560px, 100%); padding: 25px; border: 1px solid rgba(228,185,108,.35); border-radius: 22px; background: #19372b; box-shadow: var(--shadow); }
    .modal h2 { font: 500 26px Georgia, serif; }
    .modal p { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .modal-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 19px 0; }
    .modal-card { cursor: pointer; }
    .modal-card.hidden-choice { outline: 3px solid var(--coral); outline-offset: 2px; transform: translateY(-4px); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; }
    .hidden { display: none !important; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 9; max-width: min(340px, calc(100vw - 36px)); padding: 12px 15px; border: 1px solid rgba(245,211,141,.4); border-radius: 12px; color: var(--ink); background: #214735; box-shadow: var(--shadow); font-size: 13px; animation: rise .22s ease both; }
    .result-score { display: flex; justify-content: space-around; margin: 22px 0; text-align: center; }
    .result-score strong { display: block; color: var(--gold-bright); font: 700 34px Georgia, serif; }
    .result-score span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @keyframes flip-in { 0% { opacity: .25; transform: perspective(300px) rotateY(90deg) scale(.85); } 55% { box-shadow: 0 0 24px var(--gold); } 100% { opacity: 1; transform: perspective(300px) rotateY(0) scale(1); } }
    @keyframes swap-in { 0% { opacity: .25; transform: translateX(24px) rotate(8deg) scale(.8); } 65% { box-shadow: 0 0 24px var(--coral); } 100% { opacity: 1; transform: translateX(0) rotate(0) scale(1); } }
    @keyframes swap-out { 0% { opacity: .25; transform: translateY(-20px) scale(.8); } 65% { box-shadow: 0 0 24px var(--gold); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes draw-in { 0% { opacity: 0; transform: translateY(-24px) rotate(-7deg) scale(.72); } 70% { box-shadow: 0 0 20px var(--gold); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
    @keyframes discard-out { to { opacity: 0; transform: translateY(-34px) rotate(12deg) scale(.65); } }
    @keyframes discard-in { 0% { opacity: 0; transform: translateY(-22px) rotate(-8deg) scale(.75); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
    @keyframes place-set { 0% { opacity: 0; transform: translateY(26px) scale(.72); } 65% { box-shadow: 0 0 24px rgba(228,185,108,.55); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .card.flip-in, .card.swap-in, .card.swap-out, .card.draw-in, .card.discard-out, .card.discard-in, .set.placing { animation: none; } .flying-card { transition: none; } }
    @media (max-width: 620px) {
      :root { --card-w: 34px; --card-h: 49px; }
      .topbar { padding: 7px 10px; }
      .brand-tag { display: none; }
      .top-actions .ghost-btn { padding: 8px 10px; font-size: 12px; }
      .game-head { padding: 2px 0 6px; }
      .subtitle { display: none; }
      .table { border-radius: 18px; padding: 8px; grid-template-rows: minmax(62px, 1fr) 58px minmax(62px, 1fr) auto auto auto; }
      .middle { column-gap: 8px; }
      .pile-label { font-size: 10px; }
      .card { font-size: 16px; }
      .card .rank { font-size: 23px; }
      .hand { display: flex; flex-wrap: wrap; align-content: flex-start; min-height: calc(var(--card-h) + var(--card-h) + 4px); max-height: 102px; gap: 4px 0; overflow-x: hidden; overflow-y: auto; }
      .hand-card { position: relative; flex: 0 0 calc(var(--card-w) - 3px); }
      .hand-card.selected { z-index: 2; }
      .hand-wrap { padding-top: 6px; padding-bottom: 4px; }
      .set { min-height: 43px; padding: 3px; }
      .set .card { width: 30px; height: 43px; font-size: 14px; }
      .set .card:not(.face-down) + .card:not(.face-down) { margin-left: -8px; }
      .set .card .rank { font-size: 19px; }
      .set .card .suit { font-size: 10px; }
      .set .card .corner { font-size: 10px; }
      .action { min-height: 32px; padding: 5px 9px; font-size: 12px; }
    }
    @media (max-height: 650px) {
      :root { --card-w: 38px; --card-h: 54px; }
      .brand-tag, .game-head > div:first-child { display: none; }
      .game-head { justify-content: flex-end; padding-bottom: 4px; }
      .topbar { padding-top: 5px; padding-bottom: 5px; }
      .table { grid-template-rows: minmax(62px, 1fr) 60px minmax(62px, 1fr) auto auto auto; }
      .card { font-size: 17px; }
      .hand { min-height: var(--card-h); max-height: 112px; }
      .hand-note { display: none; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">L</div><div><div class="brand-name">LURIS</div><div class="brand-tag">Bluff · Build · Reveal</div></div></div>
    <div class="top-actions"><button class="ghost-btn" id="rulesBtn">How to play</button><button class="ghost-btn" id="newGameBtn">New game</button></div>
  </header>
  <main>
    <section class="game-head"><div></div><div class="turn-pill"><span class="turn-dot"></span><span id="turnLabel">Your turn</span></div></section>
    <section class="table" aria-label="Luris game table">
      <div class="player-zone bot"><div class="zone-head"><div class="player-label"><span class="avatar">◈</span> <span id="botName">BOT</span> <span class="score" id="botScore">0 points</span><span class="score" id="botHandCount">11 in hand</span></div><div class="zone-meta"><span class="clock" id="botClock">10:00</span></div></div><div class="bot-report" id="botReport">BOT has not played yet.</div><div class="sets" id="botSets"></div></div>
      <div class="middle"><div class="pile"><div class="back" id="drawPileCard">✦</div><div><div class="pile-label">Draw pile</div><div class="pile-count" id="drawCount">0</div></div></div><div class="pile right"><div class="discard" id="discardCard"></div><div><div class="pile-label">Discard</div><div class="pile-count" id="discardCount">0</div></div></div></div>
      <div class="player-zone human"><div class="zone-head"><div class="player-label"><span class="avatar">✦</span> <span id="humanName">You</span> <span class="score" id="humanScore">0 points</span><span class="score" id="humanHandCount">11 in hand</span></div><div class="zone-meta"><span class="clock" id="humanClock">10:00</span></div></div><div class="sets" id="humanSets"></div></div>
      <div class="hand-wrap"><div class="hand" id="hand"></div><div class="hand-note" id="handNote">Tap cards to select them.</div></div>
      <div class="controls" id="controls"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </main>
</div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const SUITS = ['♠', '♥', '♦', '♣'];
  const $ = id => document.getElementById(id);
  let state, selected = new Set(), selectedBoard = null, pendingSet = null, modalLocked = false, toastTimer, clockTimer, animationTimer, clockLast = 0, gameSerial = 0, cardAnimations = new Map();

  function card(value, suit = null, joker = false) { return { id: Math.random().toString(36).slice(2), value, suit, joker }; }
  function freshGame() {
    clearInterval(clockTimer); const serial = ++gameSerial;
    const deck = [];
    for (let round = 0; round < 2; round++) for (let value = 2; value <= 9; value++) for (const suit of SUITS) deck.push(card(value, suit));
    shuffle(deck);
    const startingPlayer = Math.random() < .5 ? 0 : 1;
    state = { deck, discard: [], hands: [[], []], sets: [[], []], clocks: [600000, 600000], turn: startingPlayer, turnNumber: 1, phase: 'draw', actionTaken: false, resolving: false, finalPlayer: null, over: false, seenCards: new Map(), botChallengeSet: null, botStrategy: Math.random() < .45 ? 'patient' : 'quick', botTurns: 0, botReport: startingPlayer === 1 ? 'BOT starts' : 'You start', botLog: [], message: startingPlayer === 1 ? 'BOT is thinking…' : 'Draw two cards or take the top discard.' };
    for (let i = 0; i < 10; i++) { state.hands[0].push(deck.pop()); state.hands[1].push(deck.pop()); }
    state.hands[0].push(card('Joker', null, true)); state.hands[1].push(card('Joker', null, true));
    state.discard.push(deck.pop()); rememberCard(topDiscard());
    selected.clear(); selectedBoard = null; pendingSet = null; modalLocked = false; cardAnimations.clear(); clearTimeout(animationTimer); $('modalBackdrop').classList.add('hidden');
    clockLast = performance.now(); clockTimer = setInterval(tickClock, 200); render();
    if (startingPlayer === 1) scheduleBotTurn(serial);
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
  function orderSetCards(cards) { const faceUp = cards.filter(c => c.faceUp), faceDown = cards.filter(c => !c.faceUp); shuffle(faceUp); shuffle(faceDown); return [...faceUp, ...faceDown]; }
  function animateCards(items) { clearTimeout(animationTimer); cardAnimations = new Map(items.map(item => [item.id, item.effect])); animationTimer = setTimeout(() => cardAnimations.clear(), 900); }
  function animationClass(id) { return cardAnimations.get(id) || ''; }
  function flyCard(card, fromRect, toRect, hiddenElement, done, faceUp = true) {
    if (!fromRect || !toRect) { if (done) done(); return; }
    const ghost = document.createElement('div'); ghost.className = 'flying-card'; ghost.innerHTML = cardHTML({...card, faceUp});
    Object.assign(ghost.style, { left: `${fromRect.left}px`, top: `${fromRect.top}px`, width: `${fromRect.width}px`, height: `${fromRect.height}px` });
    document.body.appendChild(ghost); if (hiddenElement) hiddenElement.style.opacity = '0';
    const destination = `translate(${toRect.left - fromRect.left}px, ${toRect.top - fromRect.top}px) scale(${toRect.width / fromRect.width}, ${toRect.height / fromRect.height})`;
    let finished = false; const finish = () => { if (finished) return; finished = true; ghost.remove(); if (hiddenElement?.isConnected) hiddenElement.style.opacity = ''; if (done) done(); };
    if (ghost.animate) { const duration = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 0 : 950, animation = ghost.animate([{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: destination, opacity: .96 }], { duration, easing: 'cubic-bezier(.2,.75,.2,1)', fill: 'forwards' }); animation.finished.then(finish, finish); }
    else { requestAnimationFrame(() => { ghost.style.transform = destination; ghost.style.opacity = '.96'; }); setTimeout(finish, 950); }
  }
  function cardSizedRectAt(element, width, height) { const rect = element?.getBoundingClientRect(); return rect ? { left: rect.left + (rect.width - width) / 2, top: rect.top + (rect.height - height) / 2, width, height } : null; }
  function sortHand(hand) { hand.sort((a, b) => (a.joker ? 99 : a.value) - (b.joker ? 99 : b.value) || SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit)); }
  function topDiscard() { return state.discard[state.discard.length - 1]; }
  function isHumanTurn() { return state.turn === 0 && !state.over; }
  function faceUpCount(player) { return state.sets[player].flatMap(s => s.cards).filter(c => c.faceUp).length; }
  function cardMatches(c, value) { return c.joker || value === c.value; }
  function cardLabel(c) { return c.joker ? 'the joker' : `${c.value}${c.suit}`; }
  function shortCardLabel(c) { return c.joker ? 'Joker' : `${c.value}${c.suit}`; }
  function rememberCard(c) { if (c) state.seenCards.set(c.id, c); }
  function setAI(set) { return set.ai ||= { createdTurn: state.turnNumber, matchingDiscardSeen: false, swappedSinceChallenge: false, matchedChallenges: 0 }; }
  function markSetPlaced(set) { const serial = gameSerial; set.placing = true; setTimeout(() => { if (serial === gameSerial) delete set.placing; }, 800); }
  function logBot(text) { state.botLog.push(text); }

  function botPlaceSet(plan) {

  }
  function findOwnSwap(kind) {

      const set = state.sets[1][setIndex], value = setValue(set), hidden = set.cards.filter(c => !c.faceUp);

      const handIndex = state.hands[1].findIndex(c => cardMatches(c, value) && !c.joker);

    }
    return null;
  }
  function performBotSwap(move) {
    const replacement = state.hands[1][move.handIndex];
    rememberCard(move.target); state.hands[1].splice(move.handIndex, 1, move.target); delete move.target.faceUp;
    replacement.faceUp = true; rememberCard(replacement);
    move.set.cards[move.set.cards.indexOf(move.target)] = replacement; move.set.cards = orderSetCards(move.set.cards); animateCards([{ id: replacement.id, effect: 'swap-in' }]);
    logBot(`Swap: ${shortCardLabel(move.target)} for a ${move.value}`);
  }
  function botSelfFlip() {
    for (let setIndex = 0; setIndex < state.sets[1].length; setIndex++) {
      const set = state.sets[1][setIndex]; if (setNeedsCorrection(set)) continue;
      const value = setValue(set), target = set.cards.find(c => !c.faceUp && cardMatches(c, value) && !c.joker);
      if (target) { target.faceUp = true; rememberCard(target); animateCards([{ id: target.id, effect: 'flip-in' }]); logBot(`Flip: ${shortCardLabel(target)} in own ${value}s`); state.botReport = botReportText(); animateMatchedFlip(set, target, scheduleBotEnd); return true; }
    }
    return false;
  }
  function resolveBotChallenge(choice) {
    const set = state.sets[0][choice.setIndex]; if (!set) return false;
    const hidden = set.cards.filter(c => !c.faceUp), target = hidden[choice.hiddenIndex]; if (!target) return false;
    target.faceUp = true; rememberCard(target); animateCards([{ id: target.id, effect: 'flip-in' }]);
    if (!cardMatches(target, choice.value)) {
      state.botChallengeSet = null;
      logBot(`Flip: ${shortCardLabel(target)} in your ${choice.value}s - destroy set`);
      state.botReport = botReportText(); revealDestroyedSet(0, set, choice.value, target, scheduleBotEnd); return 'pending';
    } else {
      const ai = setAI(set); ai.matchedChallenges++; ai.swappedSinceChallenge = false;
      const remaining = set.cards.filter(c => !c.faceUp).length;
      state.botChallengeSet = remaining ? set : null;
      logBot(`Flip: ${shortCardLabel(target)} in your ${choice.value}s - match${remaining ? ` (${remaining} hidden left)` : ''}`);
      state.botReport = botReportText(); animateMatchedFlip(set, target, scheduleBotEnd); return 'pending';
    }
  }
  function botShouldTakeDiscard() {
    const top = topDiscard(); if (!top) return false;
    if (state.deck.length <= 2 && !botCanWinFinalTurn()) return true;
    const correction = state.sets[1].some(set => set.cards.some(c => !c.faceUp && !cardMatches(c, setValue(set))) && cardMatches(top, setValue(set)));
    if (correction) return true;
    const sameInHand = state.hands[1].filter(c => !c.joker && !top.joker && c.value === top.value).length;
    const canDelayUsefulSet = state.deck.length <= 2 && buildBotSetPlan(false);
    const leading = faceUpCount(1) >= faceUpCount(0);
    if (state.deck.length <= 2 && leading && state.hands[0].length >= 4) return false;

  }
  function botCanWinFinalTurn() {
    const botScore = faceUpCount(1), humanScore = faceUpCount(0);
    let bestBotScore = botScore;
    if (findOwnSwap('correction') || state.sets[1].some(set => set.cards.some(c => !c.faceUp && cardMatches(c, setValue(set))))) bestBotScore++;
    let lowestHumanScore = humanScore;
    state.sets[0].forEach(set => { if (set.cards.some(c => !c.faceUp)) lowestHumanScore = Math.min(lowestHumanScore, humanScore - set.cards.filter(c => c.faceUp).length); });
    if (bestBotScore > lowestHumanScore) return true;
    if (bestBotScore < lowestHumanScore) return false;

    return projectedBotHand >= state.hands[0].length;
  }
  function botTurn() {
    if (state.over) return; state.botLog = []; state.botTurns++; let discardMove = null, drawMove = null;
    if (botShouldTakeDiscard()) { const sourceRect = $('discardCard').querySelector('.card')?.getBoundingClientRect(), taken = state.discard.pop(); state.hands[1].push(taken); logBot(`Take ${shortCardLabel(taken)}`); discardMove = { card: taken, sourceRect }; }
    else { const sourceRect = $('drawPileCard').getBoundingClientRect(), amount = Math.min(2, state.deck.length), cards = []; for (let i = 0; i < amount; i++) { const card = state.deck.pop(); state.hands[1].push(card); cards.push(card); } drawMove = { cards, sourceRect }; logBot(`Draw ${amount}`); if (!state.deck.length) state.finalPlayer = 1; }
    state.phase = 'action'; state.botReport = botReportText(); state.message = 'BOT is choosing an action…'; render();
    if (discardMove?.sourceRect) flyCard(discardMove.card, discardMove.sourceRect, cardSizedRectAt($('botName'), discardMove.sourceRect.width, discardMove.sourceRect.height));
    if (drawMove?.sourceRect) drawMove.cards.forEach((card, index) => { const startRect = { left: drawMove.sourceRect.left + index * 3, top: drawMove.sourceRect.top + index * 2, width: drawMove.sourceRect.width, height: drawMove.sourceRect.height }; setTimeout(() => flyCard(card, startRect, cardSizedRectAt($('botName'), drawMove.sourceRect.width, drawMove.sourceRect.height), null, null, false), index * 170); });
    const serial = gameSerial; setTimeout(() => { if (serial === gameSerial && !state.over && state.turn === 1) botAction(); }, 3000);
  }
  function scheduleBotEnd() { state.botReport = botReportText(); state.message = 'BOT is choosing a discard…'; render(); const serial = gameSerial; setTimeout(() => { if (serial === gameSerial && !state.over && state.turn === 1) botEnd(); }, 3000); }
  function botAction() {
    const finalTurn = state.finalPlayer === 1, leading = faceUpCount(1) >= faceUpCount(0);
    if (state.botChallengeSet) {
      const setIndex = state.sets[0].indexOf(state.botChallengeSet), hiddenCount = state.botChallengeSet.cards.filter(c => !c.faceUp).length;
      if (setIndex >= 0 && hiddenCount) { const result = resolveBotChallenge({ setIndex, hiddenIndex: Math.floor(Math.random() * hiddenCount), value: setValue(state.botChallengeSet), continuing: true }); if (result === 'pending') return; if (result) return scheduleBotEnd(); }
      state.botChallengeSet = null;
    }
    const strongChallenge = chooseOpponentChallenge(finalTurn && !leading ? .38 : .66);
    if (strongChallenge) { state.botChallengeSet = state.sets[0][strongChallenge.setIndex]; const result = resolveBotChallenge(strongChallenge); if (result === 'pending') return; if (result) return scheduleBotEnd(); }
    const correction = findOwnSwap('correction'); if (correction) { performBotSwap(correction); return scheduleBotEnd(); }
    if (!finalTurn) {
      const highValuePlan = buildBotSetPlan(true), normalPlan = highValuePlan ? null : buildBotSetPlan(false), plan = highValuePlan || normalPlan;
      const acceptable = plan && (highValuePlan || plan.bluffs < 2 || state.deck.length < 20 || !state.sets[1].length);
      if (acceptable && !botShouldDelaySet(plan) && botPlaceSet(plan)) return scheduleBotEnd();
    }
    const moderateChallenge = chooseOpponentChallenge(finalTurn && !leading ? .25 : .52); if (moderateChallenge) { state.botChallengeSet = state.sets[0][moderateChallenge.setIndex]; const result = resolveBotChallenge(moderateChallenge); if (result === 'pending') return; if (result) return scheduleBotEnd(); }
    if (botSelfFlip()) return;
    const jokerRetrieval = findOwnSwap('joker'); if (jokerRetrieval) { performBotSwap(jokerRetrieval); return scheduleBotEnd(); }
    const trickSwap = Math.random() < .16 ? findOwnSwap('trick') : null; if (trickSwap) { performBotSwap(trickSwap); return scheduleBotEnd(); }
    logBot('Pass'); scheduleBotEnd();
  }
  function botDiscardIndex() {

    const counts = {}; state.hands[1].forEach(c => { if (!c.joker) counts[c.value] = (counts[c.value] || 0) + 1; });

      let score = c.joker ? -100 : 8 - (counts[c.value] || 0) * 3;
      state.sets[0].forEach(set => { if (setValue(set) === c.value && opponentSetRisk(set) > .4) score -= 7; });
      state.sets[1].forEach(set => { if (setValue(set) === c.value && set.cards.some(x => !x.faceUp && !cardMatches(x, c.value))) score -= 9; });

  }
  function botEnd() {

    const sourceRect = cardSizedRectAt($('botName'), targetRect.width, targetRect.height);
    state.message = 'BOT is discarding…'; render();
    flyCard(discarded, sourceRect, targetRect, null, () => { if (serial !== gameSerial || state.over || state.turn !== 1) return; state.hands[1].splice(index, 1); state.discard.push(discarded); rememberCard(discarded); logBot(`Discard ${shortCardLabel(discarded)}`); finishBotTurn(); });
  }
  function finishBotTurn() { state.botReport = botReportText(); if (state.finalPlayer === 1) return finishGame(); state.turnNumber++; if (!switchTurn(0)) return; state.phase = 'draw'; state.actionTaken = false; state.message = 'Your turn: draw two cards or take the discard.'; render(); }
  function winner() { const scores = [faceUpCount(0), faceUpCount(1)]; if (scores[0] !== scores[1]) return scores[0] > scores[1] ? 0 : 1; if (state.hands[0].length !== state.hands[1].length) return state.hands[0].length > state.hands[1].length ? 0 : 1; return -1; }
  function finishGame() { tickClock(); if (state.over) return; state.over = true; state.phase = 'over'; clearInterval(clockTimer); const scores = [faceUpCount(0), faceUpCount(1)], wonBy = winner(); state.message = wonBy < 0 ? `It’s a draw at ${scores[0]} points.` : wonBy === 0 ? `You win ${scores[0]}–${scores[1]}!` : `BOT wins ${scores[1]}–${scores[0]}.`; render(); setTimeout(() => showResult(scores, wonBy), 300); }
  function showResult(scores, wonBy) { modalLocked = false; const title = wonBy < 0 ? 'A perfectly close game.' : wonBy === 0 ? 'You win!' : 'BOT wins!'; $('modal').innerHTML = `<h2>${title}</h2><p>${scores[0] === scores[1] && wonBy >= 0 ? `Points were tied; cards in hand decided the winner.` : wonBy < 0 ? 'Both points and cards in hand are tied.' : 'Every hidden card was a calculated risk.'}</p><div class="result-score"><div><strong>${scores[0]}</strong><span>Your points</span></div><div><strong>${scores[1]}</strong><span>BOT points</span></div></div><div class="modal-footer"><button class="action primary" id="again">Play again</button></div>`; $('modalBackdrop').classList.remove('hidden'); $('again').onclick = () => { closeModal(); freshGame(); }; }
  function showToast(text) { $('toast').textContent = text; $('toast').classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 2800); }
  function showRules() { modalLocked = false; $('modal').innerHTML = '<h2>How to play</h2><p>The deck uses ranks 2–9. You and BOT start with 10 cards and a joker. <strong>Goal:</strong> finish with more face-up cards—your points—than BOT.</p><p><strong>Each turn:</strong> Draw two cards or take the discard. Choose one action. Then discard one card to end your turn.</p><p><strong>Place set:</strong> Put down at least two matching cards face-up and at least two cards face-down. Hidden cards may match—or be bluffs.<br><strong>Flip:</strong> Reveal any hidden card. A match earns its owner a point. A mismatch destroys the whole set.<br><strong>Swap:</strong> Replace one hidden card in your set with a matching card from your hand.<br><strong>Pass:</strong> Take no action.</p><p>The joker matches every set. You may look at your own hidden cards whenever you like.</p><p>Drawing the last card starts your final turn, and you cannot place a new set. Most points wins; tied points are decided by cards left in hand.</p><p>You and BOT each have ten minutes. BOT cannot see your hidden cards—it plays only from its own cards and public information.</p><div class="modal-footer"><button class="action primary" id="closeRules">Got it</button></div>'; $('modalBackdrop').classList.remove('hidden'); $('closeRules').onclick = closeModal; }
  function showNewGameModal() { modalLocked = false; $('modal').innerHTML = '<h2>Start a new game?</h2><p>The current game will be replaced with a fresh game against BOT.</p><div class="modal-footer"><button class="action" id="cancelNewGame">Cancel</button><button class="action primary" id="confirmNewGame">Start new game</button></div>'; $('modalBackdrop').classList.remove('hidden'); $('cancelNewGame').onclick = closeModal; $('confirmNewGame').onclick = freshGame; }

  $('rulesBtn').onclick = showRules; $('newGameBtn').onclick = showNewGameModal; $('modalBackdrop').onclick = e => { if (e.target === $('modalBackdrop')) closeModal(); };
  freshGame();
})();
